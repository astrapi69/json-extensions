[versions]
file-worker-version = "19.1"
gradle-plugin-grgit-version = "5.3.3"
gradle-plugin-license-version = "0.16.1"
gradle-plugin-lombok-version = "9.8.2"
gradle-plugin-nmcp-version = "1.6.2"
gradle-plugin-spotless-version = "8.10.4"
gradle-plugin-version-catalog-update-version = "1.1.2"
gradle-plugin-versions-version = "0.66.0"
hamcrest-core-version = "3.0"
jackson-databind-version = "2.22.4"
jackson-dataformat-yaml-version = "2.22.4"
jackson-datatype-json-org-version = "2.22.4"
jackson-module-jsonSchema-version = "2.22.4"
javax-json-api-version = "1.1.4"
javax-json-version = "1.1.4"
json-version = "20260814"
json2xml-version = "1"
jsoup-version = "1.23.2"
lombok-version = "1.18.48"
meanbean-version = "3.0.0-M9"
mockito-core-version = "5.24.0"
silly-bean-version = "3.0"
silly-collection-version = "28.2"
test-object-version = "9.1"
testng-version = "7.12.0"
throwable-version = "3"
transform-json-api-version = "1"
xml-extensions-version = "8.2"
xml-jackson-extensions-version = "2.1"

[libraries]
file-worker = { module = "io.github.astrapi69:file-worker", version.ref = "file-worker-version" }
hamcrest-core = { module = "org.hamcrest:hamcrest-core", version.ref = "hamcrest-core-version" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-databind-version" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson-dataformat-yaml-version" }
jackson-datatype-json-org = { module = "com.fasterxml.jackson.datatype:jackson-datatype-json-org", version.ref = "jackson-datatype-json-org-version" }
jackson-module-jsonSchema = { module = "com.fasterxml.jackson.module:jackson-module-jsonSchema", version.ref = "jackson-module-jsonSchema-version" }
javax-json = { module = "org.glassfish:javax.json", version.ref = "javax-json-version" }
javax-json-api = { module = "javax.json:javax.json-api", version.ref = "javax-json-api-version" }
json = { module = "org.json:json", version.ref = "json-version" }
json2xml = { module = "io.github.astrapi69:json2xml", version.ref = "json2xml-version" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup-version" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok-version" }
meanbean = { module = "com.github.meanbeanlib:meanbean", version.ref = "meanbean-version" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito-core-version" }
silly-bean = { module = "io.github.astrapi69:silly-bean", version.ref = "silly-bean-version" }
silly-collection = { module = "io.github.astrapi69:silly-collection", version.ref = "silly-collection-version" }
test-object = { module = "io.github.astrapi69:test-object", version.ref = "test-object-version" }
testng = { module = "org.testng:testng", version.ref = "testng-version" }
throwable = { module = "io.github.astrapi69:throwable", version.ref = "throwable-version" }
transform-json-api = { module = "io.github.astrapi69:transform-json-api", version.ref = "transform-json-api-version" }
xml-extensions = { module = "io.github.astrapi69:xml-extensions", version.ref = "xml-extensions-version" }
xml-jackson-extensions = { module = "io.github.astrapi69:xml-jackson-extensions", version.ref = "xml-jackson-extensions-version" }

[bundles]
# The core dependencies
core-dependencies = [
    "jackson-databind",
    "jackson-dataformat-yaml",
    "jackson-module-jsonSchema",
    "json",
    "transform-json-api",
]
# Dependencies required only at test compile-time and not included in test runtime
test-compile-only = [
    "lombok",
]
# Dependencies required for unit testing
unit-testing = [
    "file-worker",
    "hamcrest-core",
    "jackson-datatype-json-org",
    "javax-json",
    "javax-json-api",
    "json2xml",
    "jsoup",
    "meanbean",
    "mockito-core",
    "silly-bean",
    "silly-collection",
    "test-object",
    "testng",
    "throwable",
    "xml-extensions",
    "xml-jackson-extensions",
]

[plugins]
gradle-versions-plugin = { id = "com.github.ben-manes.versions", version.ref = "gradle-plugin-versions-version" }
grgit-gradle = { id = "org.ajoberstar.grgit", version.ref = "gradle-plugin-grgit-version" }
license-gradle-plugin = { id = "com.github.hierynomus.license", version.ref = "gradle-plugin-license-version" }
lombok-plugin = { id = "io.freefair.lombok", version.ref = "gradle-plugin-lombok-version" }
nmcp-gradle-plugin = { id = "com.gradleup.nmcp", version.ref = "gradle-plugin-nmcp-version" }
spotless-plugin-gradle = { id = "com.diffplug.spotless", version.ref = "gradle-plugin-spotless-version" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "gradle-plugin-version-catalog-update-version" }
